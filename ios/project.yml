# Fallback project generator (optional). If the committed UCBShows.xcodeproj ever
# gets out of sync, regenerate it with XcodeGen (github.com/yonaskolb/XcodeGen;
# this Mac has no Homebrew, so use a release binary or Mint):
#
#   cd ios && xcodegen generate
#
# Mirrors UCBShows.xcodeproj/project.pbxproj — keep the two in step whenever a
# build setting, entitlement, version number or package changes.
name: UCBShows
options:
  bundleIdPrefix: com.salimhafid
  deploymentTarget:
    iOS: "18.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "23"
    DEVELOPMENT_TEAM: 8FKP6A38FJ
packages:
  # CMS signing for Apple Wallet passes (WalletPass.swift imports X509 with
  # @_spi(CMS) and SwiftASN1). Package.resolved pins 1.19.4 (+ swift-asn1
  # 1.7.1, swift-crypto 4.5.1).
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: 1.0.0
targets:
  UCBShows:
    type: application
    platform: iOS
    sources:
      # The whole folder is bundled (file-system synchronized group in the
      # committed project): Localizable.strings, Resources/, PassSigning/
      # (wwdr_g4.pem + the git-ignored pass_cert.pem / pass_key.pem) included.
      - UCBShows
    dependencies:
      - package: swift-certificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salimhafid.UCBShows
        CODE_SIGN_STYLE: Automatic
        # CloudKit container + APNs (class alerts) and the iCloud key-value
        # store (settings/tickets sync). Without this the app builds but no
        # alerts or sync work.
        CODE_SIGN_ENTITLEMENTS: UCBShows/UCBShows.entitlements
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SWIFT_EMIT_LOC_STRINGS: true
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Improv"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.entertainment"
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Improv adds shows you're going to as events in your calendar."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
