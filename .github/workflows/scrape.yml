name: Scrape feeds

on:
  schedule:
    # Hourly at an odd minute. The tightest source cadence is 3 h, but GitHub
    # starves a 3-hourly cron on a quiet repo (runs land hours late or are
    # skipped); an hourly tick gets one through often enough. Extra runs are
    # cheap: the aggregator's own per-source cadence carries every source
    # that isn't due, so a not-due run finishes in ~1 minute and scrapes
    # nothing.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Force a from-scratch scrape into a throwaway dir (no commit) — tests that runner IPs can reach the sources"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and write feeds into docs/
        env:
          # Probe mode scrapes into a throwaway dir with no previous payload,
          # so every source is due — a true test of runner connectivity.
          LOCAL_STORE_DIR: ${{ inputs.probe && 'probe-out' || 'docs' }}
        run: python publish_static.py

      - name: Commit updated feeds
        if: ${{ !inputs.probe }}
        run: |
          git config user.name "improv-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/shows.json docs/classes.json docs/talent.json
          if git diff --cached --quiet; then
            echo "feeds unchanged — nothing to publish"
          else
            git commit -m "Update feeds"
            # A human push during the multi-minute scrape window would reject
            # a bare push and silently discard this cycle's feeds — rebase our
            # commit on top (the freshly written docs/*.json win any conflict)
            # and retry once.
            git push || {
              git pull --rebase -X theirs origin main
              git push
            }
          fi
