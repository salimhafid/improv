name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"        # feed-bot commits shouldn't burn CI minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Offline pipeline tests
        run: python -m unittest discover -s tests -v
